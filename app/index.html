<body>
  <div id="app">
    <main id="stage"></main>
    <nav id="tabbar" aria-label="Sezioni" hidden>

      <a href="#/massimali" data-tab="massimali"><svg class="ico"><use href="#i-bar"/></svg><span>Massimali</span></a>

    <div id="layers"></div>
    <div id="fx" aria-hidden="true"></div>

      <div>
        <div class="boot-mark">
          <i style="height:100%;background:#ee3b2f"></i>
          <i style="height:88%;background:#3d74ff"></i>
          <i style="height:76%;background:#f7c51b"></i>
          <i style="height:64%;background:#22b85e"></i>
        </div>
        <div class="boot-word">GHISA</div>
      </div>
