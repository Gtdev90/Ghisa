// Companion app per Wear OS (OnePlus Watch 3 e altri orologi Wear OS).
// Stesso applicationId dell'app telefono: serve perché la Data Layer colleghi le due app.
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "it.ghisa.app.wear"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "it.ghisa.app"
        minSdkVersion 30
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Come per il telefono: chiave di debug, va bene per l'installazione diretta.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        compose true
    }

    lint {
        // Falso positivo: l'app usa ComponentActivity, senza Fragment.
        disable += "InvalidFragmentVersionForActivityResult"
    }

    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.activity:activity-compose:1.12.4"
    implementation "androidx.lifecycle:lifecycle-service:2.10.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"

    implementation "androidx.wear.compose:compose-foundation:1.5.6"
    implementation "androidx.wear.compose:compose-navigation:1.5.6"

    implementation "com.google.android.gms:play-services-wearable:20.0.1"
    implementation "androidx.health:health-services-client:1.1.0"
    implementation "androidx.wear:wear-ongoing:1.1.0"
    implementation "androidx.wear.tiles:tiles:1.6.2"
    implementation "androidx.wear.protolayout:protolayout:1.4.2"
    implementation "androidx.wear.watchface:watchface-complications-data-source-ktx:1.3.0"

    implementation "com.google.guava:guava:33.4.8-android"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.10.2"
}
